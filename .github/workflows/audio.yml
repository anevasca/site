name: Áudio das matérias

on:
  push:
    branches: [main, "previa-*"]
    paths: ["edicao.json", "ultimas/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python ferramentas/gerar_audio.py
        env:
          GH_TOKEN: ${{ github.token }}
