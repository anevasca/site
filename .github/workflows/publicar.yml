name: Publicar o site (com áudios)

# Publica o site no GitHub Pages a cada push na main,
# gravando antes os áudios novos (voz Francisca nas matérias) e juntando os áudios dos últimos 14 dias.
# Em Settings > Pages > Source está "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valida o conteúdo antes de publicar
        run: python3 ferramentas/validar_edicao.py
      - run: pip install edge-tts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Grava os áudios novos
        run: python ferramentas/gerar_audio.py || echo "áudio falhou; o site sobe mesmo assim"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sobe os podcasts gravados (branches gravacao-AAAA-MM-DD) cuja edição já está no ar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin '+refs/heads/gravacao-*:refs/remotes/origin/gravacao-*' || true
          hoje=$(python3 -c "import json;print(json.load(open('edicao.json'))['data'])")
          for b in $(git branch -r --list 'origin/gravacao-*'); do
            d=${b#origin/gravacao-}
            if [[ "$d" > "$hoje" ]]; then echo "podcast de $d espera a edição ir ao ar"; continue; fi
            git show "$b:podcast/pod-$d.mp3" > "/tmp/pod-$d.mp3" && \
              gh release upload audio "/tmp/pod-$d.mp3" --clobber --repo "$GITHUB_REPOSITORY" && \
              git push origin --delete "gravacao-$d" && echo "podcast de $d publicado" || echo "podcast de $d não publicado (sem arquivo ou erro); o site segue"
          done
      - name: Monta o site com os áudios
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'ferramentas' --exclude '_site' --exclude 'relatorios' --exclude 'podcast' ./ _site/
          touch _site/.nojekyll
          python3 ferramentas/juntar_audios.py _site/audio
          python3 ferramentas/gerar_feed.py _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
