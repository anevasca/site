name: Publicar o site (com áudios)

# Publica o site no GitHub Pages a cada push na main,
# gravando antes os áudios novos (voz Francisca) e juntando os áudios dos últimos 14 dias.
# Em Settings > Pages > Source está "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - name: Grava os áudios novos
        run: python ferramentas/gerar_audio.py || echo "áudio falhou; o site sobe mesmo assim"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Grava o podcast do dia (Nevasca em 10 minutos)
        run: python ferramentas/gerar_podcast.py || echo "podcast falhou; o site sobe mesmo assim"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Monta o site com os áudios
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'ferramentas' --exclude '_site' ./ _site/
          touch _site/.nojekyll
          python3 ferramentas/juntar_audios.py _site/audio
          python3 ferramentas/gerar_feed.py _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
