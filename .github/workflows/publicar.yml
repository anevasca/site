name: Publicar o site (com áudios)

# Dois jeitos de disparar:
# 1) Agendado, às 4h30 (horário de Brasília) — é o publicar de verdade da edição do dia,
#    aprovado ou não (prazo de segurança às 4h15). Aprovado ≠ publicado: mesmo que o
#    Junior aprove a edição-pendente de noite, o site só atualiza às 4h30.
# 2) Push na main que NÃO seja o merge de uma edicao-pendente-AAAA-MM-DD (ex.: últimas
#    notícias do dia, ajuste de código, Dependabot) — publica na hora, como sempre.
# Em Settings > Pages > Source está "GitHub Actions".

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * *" # 4h30 horário de Brasília (UTC-3) — publicação programada da edição do dia
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      publica: ${{ steps.checa.outputs.publica }}
    steps:
      - id: checa
        env:
          EVENTO: ${{ github.event_name }}
          MSG_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENTO" = "push" ] && [[ "$MSG_COMMIT" == *"edicao-pendente-"* ]]; then
            echo "Merge da edição do dia: só publica no horário agendado (4h30), não agora."
            echo "publica=false" >> "$GITHUB_OUTPUT"
          else
            echo "publica=true" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: decide
    if: needs.decide.outputs.publica == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Valida o conteúdo antes de publicar
        run: python3 ferramentas/validar_edicao.py
      - run: pip install Pillow
      - name: Gera as páginas de matéria, o sitemap e a capa estática
        run: python3 build.py
      - name: Sobe o que o build.py mudou (páginas, sitemap, cartões)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html m/ sitemap.xml robots.txt cartoes/
          if git diff --cached --quiet; then
            echo "Nada novo do build.py para commitar."
          else
            git commit -m "Gera páginas, sitemap e capa estática (build.py) [skip ci]"
            git push
          fi
      - run: pip install edge-tts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Grava os áudios novos
        run: python ferramentas/gerar_audio.py || echo "áudio falhou; o site sobe mesmo assim"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sobe os podcasts gravados (branches gravacao-AAAA-MM-DD) cuja edição já está no ar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin '+refs/heads/gravacao-*:refs/remotes/origin/gravacao-*' || true
          hoje=$(python3 -c "import json;print(json.load(open('edicao.json'))['data'])")
          for b in $(git branch -r --list 'origin/gravacao-*'); do
            d=${b#origin/gravacao-}
            if [[ "$d" > "$hoje" ]]; then echo "podcast de $d espera a edição ir ao ar"; continue; fi
            git show "$b:podcast/pod-$d.mp3" > "/tmp/pod-$d.mp3" && \
              gh release upload audio "/tmp/pod-$d.mp3" --clobber --repo "$GITHUB_REPOSITORY" && \
              git push origin --delete "gravacao-$d" && echo "podcast de $d publicado" || echo "podcast de $d não publicado (sem arquivo ou erro); o site segue"
          done
      - name: Monta o site com os áudios
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'ferramentas' --exclude '_site' --exclude 'relatorios' --exclude 'podcast' ./ _site/
          touch _site/.nojekyll
          python3 ferramentas/juntar_audios.py _site/audio
          python3 ferramentas/gerar_feed.py _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
