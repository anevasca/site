name: Publicar podcast gravado

# O episódio gravado por Junior e Maressa (montado com a vinheta e aprovado pelo Junior) chega num
# branch gravacao-AAAA-MM-DD com o arquivo podcast/pod-AAAA-MM-DD.mp3.
# Se a edição daquele dia já está no ar, republica o site agora (o "Publicar o site" sobe o MP3,
# atualiza feed e player e apaga o branch). Se ainda não está (gravado à noite), não faz nada:
# o episódio entra junto com a publicação da edição, às 04h30.
on:
  push:
    branches: ["gravacao-*"]

permissions:
  contents: read
  actions: write

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="${GITHUB_REF_NAME#gravacao-}"
          hoje=$(python3 -c "import json;print(json.load(open('edicao.json'))['data'])")
          if [[ "$d" > "$hoje" ]]; then echo "Edição de $d ainda não está no ar; o podcast sai junto com ela."; exit 0; fi
          gh workflow run publicar.yml --ref main --repo "$GITHUB_REPOSITORY"
